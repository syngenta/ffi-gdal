name: Continuous Integration

on:
  pull_request:
  push:

jobs:
  static_analysis:
    name: Rubocop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1.315.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Rubocop
        run: bundle exec rubocop --format github --parallel

  test:
    strategy:
      fail-fast: false
      matrix:
        # NOTE:
        # - ubuntu-22.04 has GDAL 3.4.1, PROJ 8.2.1, GEOS 3.10.2
        # - ubuntu-24.04 has GDAL 3.8.4, PROJ 9.4.0, GEOS 3.12.1
        # - ubuntu-26.04 has GDAL 3.12.2, PROJ 9.7.1, GEOS 3.14.1
        os: ["ubuntu-22.04", "ubuntu-24.04", "ubuntu-26.04"]
        ruby-version: ["2.6", "2.7", "3.0", "3.1", "3.2", "3.3", "3.4"]
        exclude:
          # ruby/setup-ruby has no prebuilt Ruby older than 3.2 for ubuntu-26.04
          - os: "ubuntu-26.04"
            ruby-version: "2.6"
          - os: "ubuntu-26.04"
            ruby-version: "2.7"
          - os: "ubuntu-26.04"
            ruby-version: "3.0"
          - os: "ubuntu-26.04"
            ruby-version: "3.1"
          # numo-narray 0.9.2.1 does not compile under the C23-default GCC of
          # ubuntu-26.04 with the Ruby 3.2 toolchain (the -std=gnu17 workaround
          # below only works with the Ruby 3.3 prebuilt interpreter)
          - os: "ubuntu-26.04"
            ruby-version: "3.2"
    name: "Test on Ruby ${{ matrix.ruby-version }} on ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install GDAL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev librttopo-dev
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@0dafeac902942906541bc140009cdbf32665b601 # v1.315.0
        env:
          # numo-narray 0.9.2.1 predates C23; GCC on ubuntu-26.04 compiles C23 by
          # default and rejects its empty-parens function pointers, so build it as gnu17
          BUNDLE_BUILD__NUMO___NARRAY: "--with-cflags=-std=gnu17"
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Run specs
        run:
          bundle exec rspec spec --format RSpec::Github::Formatter --format progress
